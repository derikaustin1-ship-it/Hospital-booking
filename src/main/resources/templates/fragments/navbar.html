<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
</head>
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-custom sticky-top">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">
            <i class="bi bi-hospital text-primary fs-3"></i>
            <span>Medi<span class="text-primary">Care</span> Hospital</span>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain"
                aria-controls="navbarMain" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarMain">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}"><i class="bi bi-house me-1"></i> Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/doctors}"><i class="bi bi-person-badge me-1"></i> Find Doctors</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/about}"><i class="bi bi-info-circle me-1"></i> About Us</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/contact}"><i class="bi bi-envelope me-1"></i> Contact</a>
                </li>
            </ul>

            <ul class="navbar-nav ms-auto align-items-center">
                <!-- Unauthenticated user links -->
                <li sec:authorize="isAnonymous()" class="nav-item me-2">
                    <a class="btn btn-outline-primary px-3 rounded-pill" th:href="@{/login}">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Login
                    </a>
                </li>
                <li sec:authorize="isAnonymous()" class="nav-item">
                    <a class="btn btn-primary px-3 rounded-pill" th:href="@{/register}">
                        <i class="bi bi-person-plus me-1"></i> Register
                    </a>
                </li>

                <!-- Patient Logged-in links -->
                <li sec:authorize="hasRole('PATIENT')" class="nav-item me-2">
                    <a class="btn btn-outline-primary btn-sm rounded-pill" th:href="@{/patient/dashboard}">
                        <i class="bi bi-speedometer2 me-1"></i> Dashboard
                    </a>
                </li>
                <li sec:authorize="hasRole('PATIENT')" class="nav-item me-2">
                    <a class="btn btn-primary btn-sm rounded-pill" th:href="@{/patient/appointment/book}">
                        <i class="bi bi-calendar-plus me-1"></i> Book Appointment
                    </a>
                </li>

                <!-- Doctor Logged-in links -->
                <li sec:authorize="hasRole('DOCTOR')" class="nav-item me-2">
                    <a class="btn btn-primary btn-sm rounded-pill" th:href="@{/doctor/dashboard}">
                        <i class="bi bi-speedometer2 me-1"></i> Doctor Dashboard
                    </a>
                </li>

                <!-- User Dropdown when Authenticated -->
                <li sec:authorize="isAuthenticated()" class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle d-flex align-items-center gap-2" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <div class="avatar-circle bg-primary text-white rounded-circle d-flex align-items-center justify-content-center" style="width: 34px; height: 34px; font-size: 0.85rem;">
                            <i class="bi bi-person-fill"></i>
                        </div>
                        <span sec:authentication="name" class="fw-semibold">User</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0" aria-labelledby="userDropdown">
                        <li sec:authorize="hasRole('PATIENT')">
                            <a class="dropdown-item" th:href="@{/patient/profile}">
                                <i class="bi bi-person me-2 text-primary"></i> My Profile
                            </a>
                        </li>
                        <li sec:authorize="hasRole('PATIENT')">
                            <a class="dropdown-item" th:href="@{/patient/appointments}">
                                <i class="bi bi-calendar-check me-2 text-success"></i> My Appointments
                            </a>
                        </li>
                        <li sec:authorize="hasRole('DOCTOR')">
                            <a class="dropdown-item" th:href="@{/doctor/profile}">
                                <i class="bi bi-person me-2 text-primary"></i> Doctor Profile
                            </a>
                        </li>
                        <li sec:authorize="hasRole('DOCTOR')">
                            <a class="dropdown-item" th:href="@{/doctor/availability}">
                                <i class="bi bi-clock-history me-2 text-info"></i> Availability
                            </a>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="d-inline">
                                <button type="submit" class="dropdown-item text-danger">
                                    <i class="bi bi-box-arrow-right me-2"></i> Logout
                                </button>
                            </form>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

</body>
</html>
