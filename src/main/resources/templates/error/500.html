<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error (500) | MediCare Hospital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">

<div class="container text-center py-5">
    <div class="card custom-card p-5 mx-auto shadow-sm" style="max-width: 540px;">
        <div class="stat-icon danger mx-auto mb-3" style="width: 80px; height: 80px; font-size: 2.5rem;">
            <i class="bi bi-exclamation-triangle"></i>
        </div>
        <h1 class="display-4 fw-bold text-danger mb-2">500</h1>
        <h4 class="fw-bold mb-3">Internal System Error</h4>
        <p class="text-muted mb-4" th:text="${errorMessage != null ? errorMessage : 'An unexpected server error occurred while processing your request.'}">
            An unexpected error occurred.
        </p>
        <div>
            <a th:href="@{/}" class="btn btn-primary rounded-pill px-4">
                <i class="bi bi-house me-1"></i> Return to Safety
            </a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
