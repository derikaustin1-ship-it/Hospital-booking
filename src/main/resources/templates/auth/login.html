<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Login | MediCare Hospital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5">
            <div class="card auth-card shadow-sm p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="bg-primary text-white p-3 rounded-circle d-inline-flex align-items-center justify-content-center mb-2" style="width: 60px; height: 60px;">
                        <i class="bi bi-shield-lock-fill fs-3"></i>
                    </div>
                    <h3 class="fw-bold">Sign In to MediCare</h3>
                    <p class="text-muted small">Access your patient appointments or doctor dashboard</p>
                </div>

                <!-- Alert Messages -->
                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show small" role="alert">
                    <i class="bi bi-exclamation-circle-fill me-1"></i> <span th:text="${errorMessage}">Invalid credentials</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show small" role="alert">
                    <i class="bi bi-check-circle-fill me-1"></i> <span th:text="${successMessage}">Logged out</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- Quick Demo Login Helpers -->
                <div class="p-3 bg-light rounded-3 border mb-4">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="small fw-bold text-muted"><i class="bi bi-lightning-charge-fill text-warning"></i> Quick Demo Auto-Fill:</span>
                    </div>
                    <div class="d-grid gap-2 d-sm-flex">
                        <button type="button" class="btn btn-outline-primary btn-sm flex-fill" onclick="fillCredentials('patient')">
                            <i class="bi bi-person me-1"></i> Demo Patient
                        </button>
                        <button type="button" class="btn btn-outline-info btn-sm flex-fill" onclick="fillCredentials('doctor')">
                            <i class="bi bi-hospital me-1"></i> Demo Doctor
                        </button>
                    </div>
                </div>

                <!-- Login Form -->
                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label for="email" class="form-label small fw-bold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-envelope text-muted"></i></span>
                            <input type="email" id="email" name="email" class="form-control" required placeholder="name@example.com">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label small fw-bold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-lock text-muted"></i></span>
                            <input type="password" id="password" name="password" class="form-control" required placeholder="Enter your password">
                        </div>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-bold fs-6">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Login
                        </button>
                    </div>

                    <div class="text-center pt-2">
                        <span class="text-muted small">Don't have an account yet?</span>
                        <a th:href="@{/register}" class="fw-bold text-primary small text-decoration-none ms-1">Register as Patient</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
